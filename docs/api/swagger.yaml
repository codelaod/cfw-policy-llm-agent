  /jobs/{id}/events/stream:
    get:
      description: See events.schema.json and the SSE contract. Lifetime 120s, heartbeat
        15s, per-write deadline 10s. No model token streaming.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
