info:
  contact: {}
  description: Persistent fixed-input rule audits, bounded Eino supplements, confirmations,
    reports and durable attempt accounting. Runtime is offline unless an explicit
    private model configuration is enabled; previews and config-check never call providers.
    Real provider capability remains separately verified.
  title: CFW offline audit workspace
  version: 0.3.0
paths:
  /audits/{id}:
    get:
      parameters:
      - description: Audit result ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/storage.AuditRecord'
      security:
      - AppToken: []
      summary: Read an immutable audit result and its sealed effective input
      tags:
      - Findings
  /audits/{id}/rechecks:
    post:
      consumes:
      - application/json
      parameters:
      - description: Old audit job ID
        in: path
        name: id
        required: true
        type: string
      - description: New fixed snapshot and evaluation time policy
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.RecheckRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/app.PlanPreview'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.Error'
      security:
      - AppToken: []
      summary: Preview a new audit linked to the old job; explicit plan acceptance
        still required
      tags:
      - Execution
  /capabilities:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.Capabilities'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.Error'
      security:
      - AppToken: []
      summary: Read configured local capabilities without external calls
      tags:
      - Workspace
  /conversations:
    get:
      parameters:
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      - default: 100
        description: Page size 1..100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ConversationPage'
      security:
      - AppToken: []
      summary: List durable conversations
      tags:
      - Conversations
    post:
      consumes:
      - application/json
      parameters:
      - description: Title and known scope, or empty scope
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.ConversationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/storage.Conversation'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.Error'
      security:
      - AppToken: []
      summary: Create and select a conversation without starting a task
      tags:
      - Conversations
  /conversations/{id}:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/storage.Conversation'
      security:
      - AppToken: []
      summary: Reopen a durable conversation
      tags:
      - Conversations
    patch:
      consumes:
      - application/json
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - description: Revision and changed fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/storage.ConversationPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/storage.Conversation'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.Error'
      security:
      - AppToken: []
      summary: Edit title, scope or archive state with revision check
      tags:
      - Conversations
  /conversations/{id}/messages:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - default: 0
        description: Last contiguous message seq
        in: query
        name: after_seq
        type: integer
      - default: 100
        description: Page size 1..100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/storage.ConversationMessagePage'
      security:
      - AppToken: []
      summary: Read public messages without replaying model calls
      tags:
      - Conversations
    post:
      consumes:
      - application/json
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - description: Explicit model acceptance and fixed input
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.AssistantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Idempotent replay
          schema:
            $ref: '#/definitions/httpapi.SendResponse'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/httpapi.SendResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.Error'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Error'
      security:
      - AppToken: []
      summary: Explicitly send a bounded assistant turn, with no cloud reads
      tags:
      - Conversations
  /data-sources:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.DataSourcePage'
      security:
      - AppToken: []
      summary: List local configured sources without credential discovery
      tags:
      - Workspace
  /e0/jobs:
    post:
      consumes:
      - application/json
      parameters:
      - description: Synthetic conversation and idempotency identifiers
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.CreateJob'
      produces:
      - application/json
      responses:
        "200":
          description: Same input replay
          schema:
            $ref: '#/definitions/storage.Job'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/storage.Job'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.Error'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Error'
      security:
      - AppToken: []
      summary: Start a synthetic local E0 probe; never a business audit
      tags:
      - E0
  /e0/jobs/{id}:
    get:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/storage.Job'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Error'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Error'
      security:
      - AppToken: []
      summary: Get a persisted task and its view_seq
      tags:
      - E0
  /e0/jobs/{id}/cancel:
    post:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/storage.Job'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Error'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Error'
      security:
      - AppToken: []
      summary: Explicitly cancel a task (disconnecting observation does not cancel)
      tags:
      - E0
  /e0/jobs/{id}/events:
    get:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - default: 0
        description: Nonnegative decimal safe integer, no greater than last_seq
        in: query
        name: after_seq
        type: integer
      - default: 100
        description: Page size 1..100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/storage.EventPage'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.Error'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Error'
      security:
      - AppToken: []
      summary: Read a consistent persisted event page; no execution side effects
      tags:
      - E0
  /e0/jobs/{id}/events/stream:
    get:
      description: See events.schema.json and the SSE contract. Lifetime 120s, heartbeat
        15s, per-write deadline 10s. No model token streaming.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - default: 0
        description: Last contiguous seq, nonnegative safe integer
        in: query
        name: after_seq
        type: integer
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE frames (id=seq, event=type, data=complete event JSON)
          headers:
            X-Subscription-Lifetime-Seconds:
              description: "120"
              type: integer
          schema:
            type: string
        "204":
          description: Terminal job cursor already at event tail
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.Error'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Error'
      security:
      - AppToken: []
      summary: Observe committed task events; reconnect only reads persisted history
      tags:
      - E0
  /execution-plans:
    post:
      consumes:
      - application/json
      parameters:
      - description: Fixed offline scope and selection
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.PlanRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/app.PlanPreview'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.Error'
      security:
      - AppToken: []
      summary: Preview and freeze bounded effects without starting execution
      tags:
      - Execution
  /findings:
    get:
      parameters:
      - description: Audit result filter
        in: query
        name: audit_id
        type: string
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      - default: 100
        description: Page size 1..100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
