    post:
      consumes:
      - application/json
      parameters:
      - description: Finding record ID
        in: path
        name: id
        required: true
        type: string
      - description: Stable review operation key
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Expected revision and action
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/storage.ReviewRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/storage.ReviewAction'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.Error'
      security:
      - AppToken: []
      summary: Append a review with CAS and idempotency
      tags:
      - Findings
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.Health'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.Error'
      security:
      - AppToken: []
      summary: Read local offline service status (no outbound requests)
      tags:
      - E0
  /jobs:
    get:
      parameters:
      - description: Conversation filter
        in: query
        name: conversation_id
        type: string
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      - default: 100
