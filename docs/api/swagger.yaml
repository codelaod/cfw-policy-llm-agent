  /findings/{id}:
    get:
      parameters:
      - description: Finding record ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.FindingDetail'
      security:
      - AppToken: []
      summary: Read evidence values from this audit's fixed effective input
      tags:
      - Findings
  /findings/{id}/review-actions:
    get:
      parameters:
      - description: Finding record ID
        in: path
        name: id
        required: true
        type: string
      - default: 0
        description: Revision cursor
        in: query
        name: after_revision
        type: integer
      - default: 100
        description: Page size 1..100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ReviewPage'
      security:
      - AppToken: []
      summary: Read immutable review actions
