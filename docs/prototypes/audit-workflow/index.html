<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23087b63%27/%3E%3C/svg%3E"><title>云防火墙审计 · 对话工作区</title>
<link rel="stylesheet" href="styles.css"><script src="engine.js" defer></script><script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#conversation">跳到对话</a>
<div class="workspace">
<aside class="sidebar" aria-label="会话导航">
<a class="brand" href="index.html"><span class="brandmark" aria-hidden="true">云</span><span>云防火墙审计<small>审计与推荐工作区</small></span></a>
<button id="newSession" class="new-session"><span aria-hidden="true">＋</span> 新建对话</button>
<div class="section-label">我的会话 <span id="slotCount">0 / 3 执行中</span></div>
<nav id="sessionList" aria-label="会话列表"></nav>
<div class="sidebar-bottom"><span class="connection-dot"></span><b>演示账号</b><p>杭州、北京 · 只读范围</p><details id="demoControls"><summary>演示情境</summary><label for="scenario">下一次模拟的情境</label><select id="scenario"></select><div class="demo-observation"><button data-action="disconnect">断开观察</button><button data-action="reconnect">恢复观察</button><button data-action="poll">轮询观察</button><button data-action="late-result">注入迟到完成</button><button data-action="history-example">重开人工历史</button></div><p>只影响人工模拟，不访问云或模型。</p></details><button id="importButton" class="import-button">导入人工资料</button><a class="help-link" href="README.md">原型说明与可复跑检查</a></div>
</aside>
<main id="main">
<header class="topbar"><div><span class="eyebrow">对话工作区</span><h1 id="sessionTitle">新的审计对话</h1></div><button class="subtle" id="contextToggle" aria-expanded="true" aria-controls="support">对象与结果 <span aria-hidden="true">+</span></button></header>
<div class="prototype-banner"><span class="demo-tag">离线交互原型</span><span>所有资源与结果均为人工构造。操作只保存在页面内存，刷新即清空。</span></div>
<div class="chat-layout">
<section class="conversation-column" aria-label="审计对话">
<div id="conversation" class="conversation" tabindex="-1"><div id="welcome"></div><div id="messages" role="log" aria-label="对话消息" aria-live="polite" aria-relevant="additions"></div></div>
<div id="taskStrip" aria-live="polite"></div>
<div class="composer-wrap"><div id="suggestions" class="suggestions"></div><form id="composer"><label class="sr-only" for="messageInput">输入审计目标或追问</label><textarea id="messageInput" rows="2" placeholder="例如：检查杭州 web-prod 的入向策略" maxlength="2000"></textarea><div class="composer-footer"><span>只读分析，建议由你审阅并手动应用</span><button type="submit" id="sendButton" class="primary">发送 <span aria-hidden="true">↑</span></button></div></form><p id="composerHint" class="composer-hint">Enter 发送，Shift + Enter 换行。请勿在对话中输入密钥。</p></div>
</section>
<aside id="support" class="support" aria-label="当前会话资料"><div class="support-tabs" role="tablist" aria-label="辅助资料"><button role="tab" data-panel="context">对象</button><button role="tab" data-panel="results">结果</button><button role="tab" data-panel="report">报告</button><button role="tab" data-panel="history">历史</button></div><div id="supportBody"></div></aside>
</div>
</main>
</div><div id="notice" role="status"></div>
<dialog id="businessDialog" aria-labelledby="businessTitle"><form id="businessForm"><div class="dialog-head"><h2 id="businessTitle">确认业务资料</h2><button type="button" data-close-dialog aria-label="关闭业务资料">×</button></div><p id="businessDescription"></p><input type="hidden" id="businessPart"><div id="businessFields"></div><div class="dialog-footer"><button type="button" data-action="unknown">保留未知</button><button class="primary" type="submit">预览确认内容</button></div></form></dialog>
<dialog id="deferDialog" aria-labelledby="deferTitle"><form id="deferForm"><div class="dialog-head"><h2 id="deferTitle">记录暂缓理由</h2><button type="button" data-close-dialog aria-label="关闭暂缓">×</button></div><label for="deferReason">理由</label><textarea id="deferReason" required rows="4" placeholder="例如：等待业务负责人核对管理入口"></textarea><div class="dialog-footer"><button class="primary" type="submit">保存暂缓</button></div></form></dialog>
<dialog id="importDialog" aria-labelledby="importTitle"><form id="importForm"><div class="dialog-head"><h2 id="importTitle">导入人工资料</h2><button type="button" data-close-dialog aria-label="关闭资料导入">×</button></div><p>仅导入公开人工样例。版本、来源、时点、完整性与资源身份必须明确；不会读取云端或计算真实规则。请勿填写凭据。</p><label for="importText">人工资料 JSON</label><textarea id="importText" rows="10" spellcheck="false"></textarea><p id="importError" role="alert"></p><div class="dialog-footer"><button class="primary" type="submit">校验并导入</button></div></form></dialog></body></html>
